<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreetPLM Results Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg0:    #0d0f18;
      --bg1:    #13151f;
      --bg2:    #1a1d2e;
      --bg3:    #22263a;
      --border: #2a2f4a;
      --text0:  #e2e8f0;
      --text1:  #94a3b8;
      --text2:  #4b5563;
      --accent: #6366f1;
      --accent2:#818cf8;
      --gold:   #f59e0b;
      --green:  #34d399;
      --red:    #f87171;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg0);
      color: var(--text0);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Toolbar ─────────────────────────────────────────────── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      height: 48px;
      background: var(--bg1);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 1000;
    }

    #toolbar h1 {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent2);
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .tb-sep { width: 1px; height: 22px; background: var(--border); }

    #load-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: background .15s;
    }
    #load-btn:hover { background: var(--accent2); }

    #file-input { display: none; }

    #stats {
      font-size: 12px;
      color: var(--text2);
      white-space: nowrap;
    }
    #stats b { color: var(--text1); }

    #filter-row {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    .filter-btn {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text1);
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn.active    { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filter-btn:hover:not(.active) { border-color: var(--accent2); color: var(--accent2); }

    /* ── Main ────────────────────────────────────────────────── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Map ─────────────────────────────────────────────────── */
    #map { flex: 1; min-width: 0; }

    /* ── Side panel ──────────────────────────────────────────── */
    #panel {
      width: 460px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg1);
      border-left: 1px solid var(--border);
      overflow: hidden;
    }

    #panel-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text2);
      gap: 8px;
      font-size: 13px;
    }
    #panel-empty svg { opacity: .25; }

    #panel-loaded {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    /* ── Image strip ─────────────────────────────────────────── */
    #img-strip {
      flex-shrink: 0;
      background: var(--bg0);
      position: relative;
      height: 400px;
      overflow: hidden;
    }
    #img-strip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #img-strip .no-img {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text2);
      font-size: 12px;
    }
    #img-strip .heading-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      color: var(--text1);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      z-index: 10;
    }

    /* ── Zone overlay ────────────────────────────────────────── */
    #zone-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      z-index: 5;
      pointer-events: none;
    }

    .zone-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid rgba(255,255,255,.09);
      transition: background .12s;
      pointer-events: auto;
      position: relative;
    }
    .zone-col:last-child { border-right: none; }
    .zone-col.zone-has-feats:hover { background: rgba(255,255,255,.06); }

    .zc-top {
      padding: 5px 4px 0;
    }
    .zc-label {
      font-size: 8px;
      color: rgba(255,255,255,.22);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 600;
      display: block;
      text-align: center;
    }
    .zone-col.zone-has-feats .zc-label {
      color: rgba(255,255,255,.38);
    }

    .zc-bottom {
      padding: 0 3px 5px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .zf-pill {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(3px);
      border-radius: 3px;
      padding: 2px 4px;
      cursor: default;
      border-left: 2px solid var(--pill-color, #555);
    }
    .zf-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--pill-color, #555);
    }
    .zf-txt {
      font-size: 8px;
      color: rgba(255,255,255,.8);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 50px;
      line-height: 1.2;
    }

    /* Floating tooltip */
    #zf-tip {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      display: none;
      background: rgba(13,15,24,.97);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      max-width: 230px;
      box-shadow: 0 4px 18px rgba(0,0,0,.6);
      font-size: 11px;
      line-height: 1.5;
      color: var(--text0);
    }
    #zf-tip .tip-cat {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 700;
      margin-bottom: 3px;
    }
    #zf-tip .tip-elem { color: var(--text0); margin-bottom: 3px; }
    #zf-tip .tip-attrs { color: var(--text1); font-size: 10px; }
    #zf-tip .tip-attr-row { display: flex; gap: 6px; }
    #zf-tip .tip-key { color: var(--text2); }
    #zf-tip .tip-val { color: var(--text1); }

    /* Zone legend strip */
    #zone-legend {
      display: none;
      flex-shrink: 0;
      background: var(--bg0);
      border-bottom: 1px solid var(--border);
      padding: 5px 8px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .leg-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text1);
    }
    .leg-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* panel scroll body */
    #panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #panel-body::-webkit-scrollbar { width: 5px; }
    #panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* meta row */
    .meta-coords {
      font-size: 12px;
      font-weight: 600;
      color: var(--text1);
      margin-bottom: 2px;
    }
    .meta-sub {
      font-size: 11px;
      color: var(--text2);
      margin-bottom: 12px;
    }
    .meta-sub b { color: var(--text1); }

    /* scene box */
    .scene-card {
      background: var(--bg0);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text0);
      line-height: 1.55;
    }
    .scene-card .lbl {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--accent2);
      font-weight: 700;
      margin-bottom: 5px;
    }

    /* section headers */
    .sec-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text2);
      font-weight: 700;
      margin-bottom: 8px;
      margin-top: 16px;
    }
    .sec-title:first-of-type { margin-top: 0; }

    /* attribute blocks */
    .attr-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent2);
      margin-bottom: 4px;
      text-transform: capitalize;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .attr-cat-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .attr-block { margin-bottom: 10px; }

    .obs {
      background: var(--bg0);
      border-radius: 5px;
      padding: 6px 8px;
      margin-bottom: 3px;
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px;
    }
    .zone-tag {
      display: inline-block;
      background: var(--bg3);
      border: 1px solid #3730a3;
      color: #a5b4fc;
      font-size: 10px;
      border-radius: 4px;
      padding: 1px 6px;
      flex-shrink: 0;
    }
    .elem-text { color: var(--text0); flex-shrink: 0; }
    .qual-text  { color: var(--text1); font-size: 11px; width: 100%; padding-left: 0; margin-top: 1px; }
    .badge {
      display: inline-block;
      font-size: 10px;
      border-radius: 4px;
      padding: 1px 6px;
      margin-top: 2px;
      border: 1px solid transparent;
    }

    /* visible text */
    .ocr-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 12px;
      padding: 5px 0;
      border-bottom: 1px solid var(--bg3);
    }
    .ocr-row:last-child { border-bottom: none; }
    .ocr-text { color: var(--text0); font-weight: 500; }
    .ocr-type { color: var(--text2); font-size: 10px; }

    /* landmarks */
    .lm-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      padding: 5px 0;
      border-bottom: 1px solid var(--bg3);
    }
    .lm-row:last-child { border-bottom: none; }
    .bear-tag {
      display: inline-block;
      width: 24px;
      text-align: center;
      background: var(--bg3);
      color: var(--accent2);
      font-size: 10px;
      border-radius: 3px;
      padding: 1px 0;
      flex-shrink: 0;
    }
    .lm-name { color: var(--text0); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lm-dist { color: var(--text2); font-size: 11px; flex-shrink: 0; }

    /* JSON tab */
    #raw-json {
      display: none;
      flex: 1;
      overflow-y: auto;
      font-family: 'Fira Mono', 'Consolas', monospace;
      font-size: 11px;
      padding: 12px;
      background: var(--bg0);
      color: #7dd3fc;
      white-space: pre;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* tab bar */
    #tab-bar {
      display: none;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg1);
      padding: 0 14px;
    }
    .tab {
      display: inline-block;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text2);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .15s;
    }
    .tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }
    .tab:hover:not(.active) { color: var(--text1); }

    /* Leaflet dark overrides */
    .leaflet-container { background: #090c14; }
    .leaflet-control-zoom a { background: var(--bg2) !important; color: var(--text1) !important; border-color: var(--border) !important; }
    .leaflet-control-zoom a:hover { background: var(--bg3) !important; }
    .leaflet-control-attribution { background: rgba(13,15,24,.7) !important; color: var(--text2) !important; font-size: 9px !important; }
    .leaflet-control-attribution a { color: var(--text2) !important; }

    /* Tooltip */
    .plm-tooltip {
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text1);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
  </style>
</head>
<body>

<!-- Floating zone feature tooltip -->
<div id="zf-tip"></div>

<div id="toolbar">
  <h1>StreetPLM Viewer</h1>
  <div class="tb-sep"></div>
  <button id="load-btn">Open Output Folder</button>
  <input type="file" id="file-input" webkitdirectory multiple>
  <div id="stats">No data loaded — click <em>Open Output Folder</em> and select the StreetPLM output root</div>
  <div id="filter-row" style="display:none">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="ok">Analysed</button>
    <button class="filter-btn" data-filter="no_sv">No SV</button>
  </div>
</div>

<div id="main">
  <div id="map"></div>

  <div id="panel">
    <div id="panel-empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
      </svg>
      Select a point on the map
    </div>

    <div id="tab-bar">
      <span class="tab active" data-tab="analysis">Analysis</span>
      <span class="tab" data-tab="json">Raw JSON</span>
    </div>

    <div id="panel-loaded">
      <!-- Image with zone overlay -->
      <div id="img-strip">
        <div class="no-img">No image</div>
      </div>

      <!-- Category legend -->
      <div id="zone-legend"></div>

      <!-- Scrollable detail body -->
      <div id="panel-body"></div>
    </div>

    <div id="raw-json"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ──────────────────────────────────────────────────────────────
// Category config — colour + short key for zone pills
// ──────────────────────────────────────────────────────────────
const CAT_CFG = {
  lighting: {
    color:   '#fcd34d',
    label:   'Lighting',
    abbrev:  'LT',
    keyFn:   o => o.condition || '',
    badgeColors: ['#2a241c','#fcd34d','#78350f'],
  },
  spatial_character: {
    color:   '#93c5fd',
    label:   'Spatial',
    abbrev:  'SP',
    keyFn:   o => o.lane_type || o.width || '',
    badgeColors: ['#1c2333','#93c5fd','#1e3a5f'],
  },
  crowdedness: {
    color:   '#6ee7b7',
    label:   'Crowd',
    abbrev:  'CR',
    keyFn:   o => o.density_level || '',
    badgeColors: ['#1c2e2a','#6ee7b7','#064e3b'],
  },
  greenery: {
    color:   '#86efac',
    label:   'Greenery',
    abbrev:  'GR',
    keyFn:   o => o.coverage || '',
    badgeColors: ['#1c2e2a','#86efac','#14532d'],
  },
  street_amenities: {
    color:   '#d8b4fe',
    label:   'Amenities',
    abbrev:  'AM',
    keyFn:   o => o.presence || '',
    badgeColors: ['#231c2e','#d8b4fe','#4a1d96'],
  },
  visible_text: {
    color:   '#94a3b8',
    label:   'Text',
    abbrev:  'TX',
    keyFn:   o => (o.text || '').slice(0, 9),
    badgeColors: ['#1f2128','#94a3b8','#334155'],
  },
};

const LIST_FIELDS   = ['lighting','spatial_character','crowdedness','greenery','street_amenities'];
const ZONE_ORDER    = ['far_left','left','center','right','far_right'];
const ZONE_LABELS   = { far_left:'far L', left:'left', center:'ctr', right:'right', far_right:'far R' };

// Per-field badge colour overrides for panel attributes
const BADGE_COLORS = {
  width:         ['#1c2333','#93c5fd','#1e3a5f'],
  enclosure:     ['#1c2333','#93c5fd','#1e3a5f'],
  passability:   ['#1c1f2e','#c4b5fd','#2e1065'],
  density_level: ['#1c2e2a','#6ee7b7','#064e3b'],
  condition:     ['#2a241c','#fcd34d','#78350f'],
  coverage:      ['#1c2e2a','#86efac','#14532d'],
  presence:      ['#231c2e','#d8b4fe','#4a1d96'],
  lane_type:     ['#1c2a1c','#4ade80','#14532d'],
  crossing:      ['#2a2a1c','#fde68a','#78350f'],
  source:        ['#2a241c','#fcd34d','#78350f'],
  surface:       ['#1f2128','#94a3b8','#334155'],
};

// ──────────────────────────────────────────────────────────────
// Map init
// ──────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([41.398, 2.169], 16);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom: 20,
}).addTo(map);

// ──────────────────────────────────────────────────────────────
// State
// ──────────────────────────────────────────────────────────────
let imageFiles   = {};
let allMarkers   = [];
let activeMarker = null;
let currentFilter = 'all';
let activeObjectUrl = null;

// ──────────────────────────────────────────────────────────────
// Icons
// ──────────────────────────────────────────────────────────────
function circleIcon(fill, size, ring) {
  const s = size, r = ring || 'rgba(0,0,0,0)';
  return L.divIcon({
    className: '',
    html: `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${fill};
                border:2px solid ${r};box-shadow:0 1px 4px rgba(0,0,0,.6)"></div>`,
    iconSize:   [s, s],
    iconAnchor: [s/2, s/2],
  });
}

const ICONS = {
  ok:     circleIcon('#6366f1', 10, 'rgba(99,102,241,.35)'),
  no_sv:  circleIcon('#374151', 8,  'rgba(55,65,81,.3)'),
  active: circleIcon('#f59e0b', 14, 'rgba(245,158,11,.45)'),
};

// ──────────────────────────────────────────────────────────────
// Floating tooltip for zone pills
// ──────────────────────────────────────────────────────────────
const tip = document.getElementById('zf-tip');
let tipTarget = null;

document.addEventListener('mousemove', e => {
  if (!tip._vis) return;
  const x = e.clientX + 14, y = e.clientY - 8;
  // Keep within viewport
  tip.style.left = Math.min(x, window.innerWidth  - tip.offsetWidth  - 8) + 'px';
  tip.style.top  = Math.max(8, Math.min(y, window.innerHeight - tip.offsetHeight - 8)) + 'px';
});

document.addEventListener('mouseover', e => {
  const pill = e.target.closest('.zf-pill[data-cat]');
  if (!pill) return;
  const { cat, elem, attrs } = pill._tipData || {};
  if (!cat) return;
  const cfg = CAT_CFG[cat] || {};

  let html = `<div class="tip-cat" style="color:${cfg.color}">${cfg.label || cat}</div>`;
  if (elem) html += `<div class="tip-elem">${esc(elem)}</div>`;
  if (attrs && attrs.length) {
    html += '<div class="tip-attrs">'
      + attrs.map(([k, v]) => `<div class="tip-attr-row"><span class="tip-key">${esc(k)}</span><span class="tip-val">${esc(v)}</span></div>`).join('')
      + '</div>';
  }

  tip.innerHTML = html;
  tip.style.display = 'block';
  tip._vis = true;
  tipTarget = pill;
});

document.addEventListener('mouseout', e => {
  const pill = e.target.closest('.zf-pill[data-cat]');
  if (pill) { tip.style.display = 'none'; tip._vis = false; tipTarget = null; }
});

// ──────────────────────────────────────────────────────────────
// File picker
// ──────────────────────────────────────────────────────────────
document.getElementById('load-btn').addEventListener('click', () =>
  document.getElementById('file-input').click()
);

document.getElementById('file-input').addEventListener('change', async function () {
  const files = Array.from(this.files);

  allMarkers.forEach(({ marker }) => map.removeLayer(marker));
  allMarkers = [];
  imageFiles = {};
  activeMarker = null;
  if (activeObjectUrl) { URL.revokeObjectURL(activeObjectUrl); activeObjectUrl = null; }
  resetPanel();

  files
    .filter(f => /\.(jpg|jpeg|png)$/i.test(f.name))
    .forEach(f => { imageFiles[f.name] = f; });

  const jsonFiles = files.filter(f => f.name.endsWith('_analysis.json'));
  if (!jsonFiles.length) {
    document.getElementById('stats').textContent = 'No _analysis.json files found — select the StreetPLM output folder.';
    return;
  }

  let okCount = 0, noSvCount = 0;
  const latlngs = [];

  for (const file of jsonFiles) {
    let rec;
    try { rec = JSON.parse(await file.text()); } catch { continue; }
    const meta = rec.metadata || {};
    if (meta.latitude == null || meta.longitude == null) continue;

    const status = meta.status || 'ok';
    if (status === 'ok') okCount++; else noSvCount++;

    const marker = L.marker([meta.latitude, meta.longitude], {
      icon: ICONS[status] || ICONS.ok,
    }).addTo(map);

    const street = meta.street_name && meta.street_name !== 'manual'
      ? meta.street_name : '';
    marker.bindTooltip(
      `<span>${street || (meta.latitude.toFixed(5) + ', ' + meta.longitude.toFixed(5))}</span>`,
      { className: 'plm-tooltip', direction: 'top', offset: [0, -6] }
    );

    const entry = { marker, rec, status };
    marker.on('click', () => selectMarker(entry));
    allMarkers.push(entry);
    latlngs.push([meta.latitude, meta.longitude]);
  }

  if (latlngs.length) map.fitBounds(latlngs, { padding: [50, 50] });

  document.getElementById('stats').innerHTML =
    `<b>${jsonFiles.length}</b> points &nbsp;·&nbsp; `
    + `<b style="color:#818cf8">${okCount}</b> analysed &nbsp;·&nbsp; `
    + `<b style="color:#4b5563">${noSvCount}</b> no Street View`;

  document.getElementById('filter-row').style.display = 'flex';
  applyFilter(currentFilter);
});

// ──────────────────────────────────────────────────────────────
// Filter
// ──────────────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilter(currentFilter);
  });
});

function applyFilter(f) {
  allMarkers.forEach(({ marker, status }) => {
    const show = f === 'all'
      || (f === 'ok'    && status === 'ok')
      || (f === 'no_sv' && status !== 'ok');
    if (show) map.addLayer(marker); else map.removeLayer(marker);
  });
}

// ──────────────────────────────────────────────────────────────
// Marker selection
// ──────────────────────────────────────────────────────────────
function selectMarker(entry) {
  if (activeMarker && activeMarker !== entry)
    activeMarker.marker.setIcon(ICONS[activeMarker.status] || ICONS.ok);
  activeMarker = entry;
  entry.marker.setIcon(ICONS.active);
  renderPanel(entry.rec);
}

// ──────────────────────────────────────────────────────────────
// Panel: tab switching
// ──────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const which = tab.dataset.tab;
    document.getElementById('panel-loaded').style.display = which === 'analysis' ? 'flex' : 'none';
    document.getElementById('raw-json').style.display     = which === 'json'     ? 'block' : 'none';
  });
});

// ──────────────────────────────────────────────────────────────
// Zone overlay builder
// ──────────────────────────────────────────────────────────────
function normalizeZone(z) {
  return (z || '').toLowerCase().trim().replace(/\s+/g, '_');
}

function buildZoneOverlay(scene) {
  // Collect all observations grouped by zone
  const byZone = {};
  ZONE_ORDER.forEach(z => { byZone[z] = []; });

  for (const [cat, cfg] of Object.entries(CAT_CFG)) {
    let items = scene[cat] || [];
    if (!Array.isArray(items)) items = items ? [items] : [];
    for (const item of items) {
      if (!item || typeof item !== 'object') continue;
      const z = normalizeZone(item.zone);
      if (!byZone[z]) byZone[z] = [];
      byZone[z].push({ cat, cfg, item });
    }
  }

  const cols = ZONE_ORDER.map(zone => {
    const feats = byZone[zone] || [];
    const hasFeats = feats.length > 0;

    const pills = feats.map(({ cat, cfg, item }) => {
      const keyVal = cfg.keyFn(item);
      const pillText = keyVal || cfg.abbrev;
      const attrs = Object.entries(item)
        .filter(([k]) => k !== 'zone' && k !== 'element');
      // pill element — _tipData attached via JS after insert
      const pillId = `pill_${Math.random().toString(36).slice(2)}`;
      return { cat, cfg, item, keyVal, pillText, attrs, pillId };
    });

    const pillsHTML = pills.map(p =>
      `<div class="zf-pill" id="${p.pillId}" data-cat="${esc(p.cat)}"
            style="--pill-color:${p.cfg.color}">
         <span class="zf-dot"></span>
         <span class="zf-txt">${esc(p.pillText)}</span>
       </div>`
    ).join('');

    return {
      html: `<div class="zone-col${hasFeats ? ' zone-has-feats' : ''}" data-zone="${zone}">
               <div class="zc-top"><span class="zc-label">${ZONE_LABELS[zone] || zone}</span></div>
               <div class="zc-bottom">${pillsHTML}</div>
             </div>`,
      pills,
    };
  });

  return { html: cols.map(c => c.html).join(''), allPills: cols.flatMap(c => c.pills) };
}

// ──────────────────────────────────────────────────────────────
// Category legend
// ──────────────────────────────────────────────────────────────
function buildLegend(scene) {
  const present = Object.keys(CAT_CFG).filter(cat => {
    const items = scene[cat] || [];
    return Array.isArray(items) ? items.length > 0 : !!items;
  });
  if (!present.length) return '';
  return present.map(cat => {
    const cfg = CAT_CFG[cat];
    return `<div class="leg-item">
      <div class="leg-dot" style="background:${cfg.color}"></div>
      <span>${cfg.label}</span>
    </div>`;
  }).join('');
}

// ──────────────────────────────────────────────────────────────
// Panel: render
// ──────────────────────────────────────────────────────────────
function resetPanel() {
  document.getElementById('panel-empty').style.display  = 'flex';
  document.getElementById('tab-bar').style.display      = 'none';
  document.getElementById('panel-loaded').style.display = 'none';
  document.getElementById('raw-json').style.display     = 'none';
  document.getElementById('zone-legend').style.display  = 'none';
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===0));
}

async function renderPanel(rec) {
  const meta  = rec.metadata       || {};
  const scene = rec.scene_analysis || {};
  const lms   = rec.nearby_landmarks || [];

  // Show chrome
  document.getElementById('panel-empty').style.display  = 'none';
  document.getElementById('tab-bar').style.display      = 'flex';
  document.getElementById('panel-loaded').style.display = 'flex';
  document.getElementById('raw-json').style.display     = 'none';
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===0));

  // Raw JSON
  document.getElementById('raw-json').textContent = JSON.stringify(rec, null, 2);

  // ── Image strip + zone overlay ──
  const strip = document.getElementById('img-strip');
  if (activeObjectUrl) { URL.revokeObjectURL(activeObjectUrl); activeObjectUrl = null; }

  const imgName = meta.source_image || '';
  const headingBadge = meta.heading != null
    ? `<div class="heading-badge">${meta.heading.toFixed(0)}°</div>` : '';

  if (imgName && imageFiles[imgName]) {
    activeObjectUrl = URL.createObjectURL(imageFiles[imgName]);
    strip.innerHTML = `<img src="${activeObjectUrl}" alt="Street View">${headingBadge}`;
  } else {
    strip.innerHTML = `<div class="no-img">Image not available${imgName ? ': '+esc(imgName) : ''}</div>${headingBadge}`;
  }

  // Build and inject zone overlay
  const { html: overlayHTML, allPills } = buildZoneOverlay(scene);
  const overlay = document.createElement('div');
  overlay.id = 'zone-overlay';
  overlay.innerHTML = overlayHTML;
  strip.appendChild(overlay);

  // Attach tooltip data to pills (can't serialise to data-* cleanly)
  allPills.forEach(p => {
    const el = document.getElementById(p.pillId);
    if (el) el._tipData = { cat: p.cat, elem: p.item.element || '', attrs: p.attrs };
  });

  // ── Category legend ──
  const legend = document.getElementById('zone-legend');
  const legendHTML = buildLegend(scene);
  if (legendHTML) {
    legend.innerHTML = legendHTML;
    legend.style.display = 'flex';
  } else {
    legend.style.display = 'none';
  }

  // ── Metadata ──
  const ts = (meta.timestamp || '').replace(
    /(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/, '$1-$2-$3 $4:$5'
  );
  const street = meta.street_name && meta.street_name !== 'manual'
    ? `<b>${esc(meta.street_name)}</b>` : '';
  const subParts = [
    street,
    meta.highway_type ? esc(meta.highway_type) : '',
    meta.latency_ms   ? `${meta.latency_ms} ms` : '',
    ts,
  ].filter(Boolean);

  // ── Scene card ──
  const sceneText = esc(scene.scene || 'No description available');

  // ── Zone attributes (panel body) ──
  let attrsHTML = '';
  for (const field of LIST_FIELDS) {
    let items = scene[field] || [];
    if (!Array.isArray(items)) items = items ? [items] : [];
    if (!items.length) continue;

    const cfg = CAT_CFG[field];

    let obsHTML = '';
    for (const obs of items) {
      if (!obs || typeof obs !== 'object') continue;
      const zone = obs.zone || '?';
      const elem = obs.element || '';

      const tagEntries = Object.entries(obs).filter(([k]) => k !== 'zone' && k !== 'element');
      const badges = tagEntries.map(([k, v]) => {
        const [bg, fg, border] = BADGE_COLORS[k] || ['#1c2333','#94a3b8','#334155'];
        return `<span class="badge" style="background:${bg};color:${fg};border-color:${border}">${esc(k)}: ${esc(v)}</span>`;
      }).join('');

      obsHTML += `
        <div class="obs">
          <span class="zone-tag">${esc(zone)}</span>
          ${elem ? `<span class="elem-text">${esc(elem)}</span>` : ''}
          <span style="display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;width:100%">${badges}</span>
        </div>`;
    }
    if (!obsHTML) continue;

    attrsHTML += `
      <div class="attr-block">
        <div class="attr-name">
          <span class="attr-cat-dot" style="background:${cfg.color}"></span>
          ${esc(field.replace(/_/g,' '))}
        </div>
        ${obsHTML}
      </div>`;
  }

  // ── Visible text ──
  let ocrHTML = '';
  const vt = scene.visible_text || [];
  if (Array.isArray(vt) && vt.length) {
    const rows = vt.map(e => `
      <div class="ocr-row">
        <span class="zone-tag">${esc(e.zone||'?')}</span>
        <span class="ocr-text">${esc(e.text||'?')}</span>
        <span class="ocr-type">${esc(e.type||'')}</span>
      </div>`).join('');
    ocrHTML = `<div class="sec-title">Visible Text</div>${rows}`;
  }

  // ── Landmarks ──
  let lmHTML = '';
  if (lms.length) {
    const rows = lms.map(lm => `
      <div class="lm-row">
        <span class="bear-tag">${esc(lm.bearing)}</span>
        <span class="lm-name">${esc(lm.name)}</span>
        <span class="lm-dist">${lm.distance_m} m · ${esc(lm.category)}</span>
      </div>`).join('');
    lmHTML = `<div class="sec-title">Nearby Landmarks</div>${rows}`;
  }

  document.getElementById('panel-body').innerHTML = `
    <div class="meta-coords">${(meta.latitude||0).toFixed(6)}, ${(meta.longitude||0).toFixed(6)}</div>
    <div class="meta-sub">${subParts.join(' &nbsp;·&nbsp; ')}</div>

    <div class="scene-card">
      <div class="lbl">Scene</div>
      ${sceneText}
    </div>

    <div class="sec-title">Zone Attributes</div>
    ${attrsHTML || '<div style="color:var(--text2);font-size:12px;padding:4px 0">No attributes detected</div>'}

    ${ocrHTML}
    ${lmHTML}
  `;
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
</script>
</body>
