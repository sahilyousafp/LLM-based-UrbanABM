<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PerceptionLM — Street Scene Analysis Viewer</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --accent: #6c8aff;
    --accent2: #ff6c8a;
    --text: #e4e6f0;
    --muted: #8b8fa3;
    --green: #4ade80;
    --amber: #fbbf24;
    --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 1.25rem; font-weight: 600; }
  header .badge {
    background: var(--accent);
    color: #fff;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .controls {
    padding: 16px 32px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .controls select, .controls input[type="file"] {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.875rem;
    cursor: pointer;
  }
  .controls label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-right: -8px;
  }
  .controls .paste-btn {
    background: var(--card);
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .controls .paste-btn:hover { background: rgba(108, 138, 255, 0.15); }

  .main {
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 24px;
    padding: 24px 32px;
    max-width: 1600px;
    margin: 0 auto;
  }
  @media (max-width: 1024px) { .main { grid-template-columns: 1fr; } }

  /* --- Image Panel --- */
  .image-panel {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
    position: sticky;
    top: 24px;
    align-self: start;
  }
  .image-panel h2 {
    padding: 14px 18px;
    font-size: 0.95rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .image-panel h2 span { margin-left: auto; font-size: 0.78rem; color: var(--muted); }
  .image-container {
    aspect-ratio: 1;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .image-container .no-img {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .meta-row {
    display: flex;
    gap: 14px;
    padding: 10px 18px;
    border-top: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .meta-row span { white-space: nowrap; }
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 16px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    font-size: 0.78rem;
  }
  .meta-grid .mk { color: var(--muted); }
  .meta-grid .mv { color: var(--text); font-family: var(--mono); }

  /* --- Analysis Panel --- */
  .analysis-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .section-card {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .section-card h2 {
    padding: 14px 18px;
    font-size: 0.95rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-body { padding: 18px; }

  .field {
    margin-bottom: 16px;
  }
  .field:last-child { margin-bottom: 0; }
  .field-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .field-value {
    font-size: 0.9rem;
    line-height: 1.65;
    color: var(--text);
  }
  .field-value.unknown {
    color: var(--muted);
    font-style: italic;
  }

  .perspective-card {
    background: rgba(108, 138, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .perspective-card:last-child { margin-bottom: 0; }
  .perspective-card .emoji {
    font-size: 1.1rem;
    margin-right: 6px;
  }
  .perspective-card .role {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .perspective-card .text {
    font-size: 0.88rem;
    line-height: 1.6;
  }

  .quality-bar {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }
  .quality-dot {
    width: 18px;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
  }
  .quality-dot.filled { background: var(--green); }
  .quality-dot.empty { background: var(--border); }

  .json-raw {
    font-family: var(--mono);
    font-size: 0.78rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 500px;
    overflow-y: auto;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    grid-column: 1 / -1;
  }
  .empty-state h3 { margin-bottom: 8px; color: var(--text); }

  .latency {
    font-family: var(--mono);
    color: var(--accent2);
  }

  /* Paste modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 90%;
    max-width: 700px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal h3 { font-size: 1rem; }
  .modal textarea {
    font-family: var(--mono);
    font-size: 0.8rem;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    flex: 1;
    min-height: 250px;
    resize: vertical;
  }
  .modal .btn-row { display: flex; gap: 10px; justify-content: flex-end; }
  .modal button {
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    border: none;
  }
  .modal .btn-cancel { background: var(--border); color: var(--text); }
  .modal .btn-load { background: var(--accent); color: #fff; font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>🏙️ PerceptionLM Street Scene Analyzer</h1>
  <span class="badge">PLM-1B · Full Scene</span>
</header>

<div class="controls">
  <label for="resultSelect">Result file:</label>
  <select id="resultSelect"><option value="">— load a JSON result —</option></select>
  <label for="fileInput">or upload:</label>
  <input type="file" id="fileInput" accept=".json">
  <button class="paste-btn" id="pasteBtn">📋 Paste JSON</button>
</div>

<div class="main" id="mainContent">
  <div class="empty-state">
    <h3>No result loaded</h3>
    <p>Select a result file, upload JSON, or paste the trial cell output.</p>
    <p style="margin-top:12px; font-size:0.8rem;">
      Run the 🧪 trial cell in the notebook, then paste the Result JSON here.
    </p>
  </div>
</div>

<!-- Paste JSON modal -->
<div class="modal-overlay" id="pasteModal">
  <div class="modal">
    <h3>📋 Paste Result JSON</h3>
    <textarea id="pasteArea" placeholder='Paste the JSON output from the trial cell here...'></textarea>
    <div class="btn-row">
      <button class="btn-cancel" id="pasteCancel">Cancel</button>
      <button class="btn-load" id="pasteLoad">Load</button>
    </div>
  </div>
</div>

<script>
const URBAN_FIELDS = [
  { key: 'scene_overview',     label: 'Scene Overview',     icon: '🏙️' },
  { key: 'buildings',          label: 'Buildings',          icon: '🏢' },
  { key: 'materials',          label: 'Materials',          icon: '🧱' },
  { key: 'building_condition', label: 'Building Condition', icon: '🔧' },
  { key: 'street_furniture',   label: 'Street Furniture',   icon: '💺' },
  { key: 'vegetation',         label: 'Vegetation',         icon: '🌳' },
  { key: 'signage',            label: 'Signage',            icon: '🪧' },
  { key: 'ground_surfaces',    label: 'Ground Surfaces',    icon: '🛤️' },
  { key: 'spatial_enclosure',  label: 'Spatial Enclosure',  icon: '📐' },
  { key: 'pedestrian_activity',label: 'Pedestrian Activity',icon: '🚶' },
  { key: 'lighting_atmosphere',label: 'Lighting & Atmosphere', icon: '☀️' },
];
const PERSPECTIVE_FIELDS = [
  { key: 'as_resident', label: 'Resident',  emoji: '🏠' },
  { key: 'as_commuter', label: 'Commuter',  emoji: '🚶' },
  { key: 'as_tourist',  label: 'Tourist',   emoji: '📸' },
  { key: 'as_student',  label: 'Student',   emoji: '🎓' },
];

let currentData = null;

/* ---- Load result list from results/ directory ---- */
async function loadResultList() {
  const select = document.getElementById('resultSelect');
  // Try multiple possible paths
  for (const base of ['output/results/', 'results/']) {
    try {
      const resp = await fetch(base);
      if (!resp.ok) continue;
      const text = await resp.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(text, 'text/html');
      const links = [...doc.querySelectorAll('a')].map(a => a.textContent.trim())
        .filter(n => n.endsWith('.json'));
      links.sort().reverse();
      links.forEach(name => {
        const opt = document.createElement('option');
        opt.value = `${base}${name}`;
        opt.textContent = name;
        select.appendChild(opt);
      });
      if (links.length) break;
    } catch { /* not available */ }
  }
}

document.getElementById('resultSelect').addEventListener('change', async e => {
  if (!e.target.value) return;
  try {
    const resp = await fetch(e.target.value);
    currentData = await resp.json();
    render();
  } catch (err) { alert('Failed to load: ' + err.message); }
});

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { currentData = JSON.parse(reader.result); render(); }
    catch (err) { alert('Invalid JSON: ' + err.message); }
  };
  reader.readAsText(file);
});

/* ---- Paste JSON modal ---- */
document.getElementById('pasteBtn').addEventListener('click', () => {
  document.getElementById('pasteModal').classList.add('open');
  document.getElementById('pasteArea').focus();
});
document.getElementById('pasteCancel').addEventListener('click', () => {
  document.getElementById('pasteModal').classList.remove('open');
});
document.getElementById('pasteLoad').addEventListener('click', () => {
  const raw = document.getElementById('pasteArea').value.trim();
  if (!raw) return;
  try {
    currentData = JSON.parse(raw);
    render();
    document.getElementById('pasteModal').classList.remove('open');
  } catch (err) { alert('Invalid JSON: ' + err.message); }
});
document.getElementById('pasteModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});

/* ---- Render full scene analysis ---- */
function render() {
  if (!currentData) return;
  const main = document.getElementById('mainContent');
  const meta = currentData.metadata || {};
  const scene = currentData.scene_analysis || currentData.quadrant_analysis || {};

  // Determine image source path
  const imgFile = meta.source_image || '';
  const imgPaths = [
    `output/images/${imgFile}`,
    `images/${imgFile}`,
    imgFile,
  ];

  // Count populated fields
  const total = [...URBAN_FIELDS, ...PERSPECTIVE_FIELDS].length;
  const filled = [...URBAN_FIELDS, ...PERSPECTIVE_FIELDS]
    .filter(f => scene[f.key] && scene[f.key] !== 'unknown').length;

  main.innerHTML = `
    <!-- Left: Image + Metadata -->
    <div class="image-panel">
      <h2>📷 Street View <span>${imgFile}</span></h2>
      <div class="image-container">
        <img id="srcImg" src="${imgPaths[0]}" alt="street view"
             onerror="this.onerror=null; tryNextImage(this);">
      </div>
      <div class="meta-grid">
        <span class="mk">📍 Location</span>
        <span class="mv">${meta.latitude ?? '—'}, ${meta.longitude ?? '—'}</span>
        <span class="mk">🧭 Heading</span>
        <span class="mv">${meta.heading ?? 0}°</span>
        <span class="mk">🛣️ Street</span>
        <span class="mv">${meta.street_name && meta.street_name !== 'unknown' ? meta.street_name : '—'}</span>
        <span class="mk">🤖 Model</span>
        <span class="mv">${meta.model || 'PLM-1B'}</span>
        <span class="mk">💻 Device</span>
        <span class="mv">${meta.device || 'cpu'}</span>
        <span class="mk">⏱️ Latency</span>
        <span class="mv latency">${meta.latency_ms ? (meta.latency_ms / 1000).toFixed(1) + 's' : '—'}</span>
        <span class="mk">🕐 Timestamp</span>
        <span class="mv">${meta.timestamp || '—'}</span>
        <span class="mk">📊 Coverage</span>
        <span class="mv">${filled}/${total} fields</span>
      </div>
      <div style="padding:10px 18px;">
        <div class="quality-bar">
          ${Array.from({length: total}, (_, i) =>
            `<div class="quality-dot ${i < filled ? 'filled' : 'empty'}"></div>`
          ).join('')}
        </div>
      </div>
    </div>

    <!-- Right: Analysis -->
    <div class="analysis-panel">
      <!-- Urban Elements -->
      <div class="section-card">
        <h2>🏙️ Urban Scene Analysis</h2>
        <div class="section-body">
          ${URBAN_FIELDS.map(f => {
            const val = scene[f.key];
            const isUnknown = !val || val === 'unknown';
            return `<div class="field">
              <div class="field-label">${f.icon} ${f.label}</div>
              <div class="field-value ${isUnknown ? 'unknown' : ''}">${isUnknown ? 'Not detected' : escHtml(val)}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- Viewer Perspectives -->
      <div class="section-card">
        <h2>👁️ Walker Perspectives</h2>
        <div class="section-body">
          ${PERSPECTIVE_FIELDS.map(f => {
            const val = scene[f.key];
            const isUnknown = !val || val === 'unknown';
            return `<div class="perspective-card">
              <div class="role"><span class="emoji">${f.emoji}</span> ${f.label}</div>
              <div class="text ${isUnknown ? 'unknown' : ''}">${isUnknown ? 'No perspective generated' : escHtml(val)}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- Raw JSON -->
      <div class="section-card">
        <h2>📄 Raw JSON</h2>
        <div class="section-body">
          <div class="json-raw">${escHtml(JSON.stringify(currentData, null, 2))}</div>
        </div>
      </div>
    </div>
  `;
}

/* Try alternate image paths on error */
const IMG_BASES = ['output/images/', 'images/', ''];
let imgAttempt = 0;
function tryNextImage(img) {
  imgAttempt++;
  const file = img.alt === 'street view' ? (currentData?.metadata?.source_image || '') : '';
  if (imgAttempt < IMG_BASES.length && file) {
    img.src = IMG_BASES[imgAttempt] + file;
  } else {
    img.style.display = 'none';
    img.parentElement.innerHTML = '<span class="no-img">Image not available</span>';
  }
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

/* ---- Init ---- */
loadResultList();
</script>
</body>
</html>
