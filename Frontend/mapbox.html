<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Urban ABM — Mapbox</title>
    
    <!-- Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #1a1a1a;
            overflow: hidden;
        }
        
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        
        /* Panel System */
        .panel {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
            padding: 16px;
            z-index: 1000;
        }
        
        .panel-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Top Control Panel */
        .control-panel {
            top: 16px;
            right: 16px;
            width: 280px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
        }
        
        /* Info Panel (bottom left) */
        .info-panel {
            bottom: 16px;
            left: 16px;
            min-width: 200px;
        }
        
        /* Agent Panel (expandable) */
        .agent-panel {
            top: 16px;
            left: 16px;
            width: 320px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            display: none;
        }
        
        /* Section Dividers */
        .section {
            margin: 16px 0;
            padding: 12px 0;
            border-top: 1px solid #e5e5e5;
        }
        
        .section:first-child {
            border-top: none;
            margin-top: 0;
            padding-top: 0;
        }
        
        /* API Config */
        .api-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            transition: border-color 0.2s;
        }
        
        .api-input:focus-visible {
            outline: 2px solid #4A90E2;
            outline-offset: 2px;
            border-color: #4A90E2;
        }
        
        /* Layer Toggles */
        .layer-toggle {
            display: flex;
            align-items: center;
            padding: 8px 0;
            cursor: pointer;
            user-select: none;
        }
        
        .layer-toggle input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }
        
        .layer-toggle label {
            font-size: 13px;
            cursor: pointer;
            flex: 1;
        }
        
        .layer-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            margin-left: auto;
        }
        
        /* Buttons */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            width: 100%;
            margin: 4px 0;
            touch-action: manipulation;
        }
        
        .btn:focus-visible {
            outline: 2px solid #4A90E2;
            outline-offset: 2px;
        }
        
        .btn-primary {
            background: #4A90E2;
            color: white;
        }
        
        .btn-primary:hover {
            background: #357ABD;
        }
        
        .btn-danger {
            background: #E74C3C;
            color: white;
        }
        
        .btn-danger:hover {
            background: #C0392B;
        }
        
        <!-- Speed Control -->
        .speed-control {
            margin-top: 8px;
        }
        
        .speed-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        
        .speed-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
            touch-action: manipulation;
        }
        
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4A90E2;
            cursor: pointer;
        }
        
        .speed-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4A90E2;
            cursor: pointer;
            border: none;
        }
        
        .speed-slider:focus-visible {
            outline: 2px solid #4A90E2;
            outline-offset: 2px;
        }
        
        /* Search Box */
        .search-box {
            display: flex;
            gap: 8px;
        }
        
        .search-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .search-input:focus-visible {
            outline: 2px solid #4A90E2;
            outline-offset: 2px;
            border-color: #4A90E2;
        }
        
        .search-btn {
            padding: 8px 16px;
            background: #4A90E2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            touch-action: manipulation;
        }
        
        .search-btn:hover {
            background: #357ABD;
        }
        
        .search-btn:focus-visible {
            outline: 2px solid #4A90E2;
            outline-offset: 2px;
        }
        
        /* Stats Display */
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 12px;
        }
        
        .stat-label {
            color: #666;
        }
        
        .stat-value {
            font-weight: 600;
            color: #1a1a1a;
            font-variant-numeric: tabular-nums;
        }
        
        /* Agent Info */
        .agent-info-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 8px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        
        .agent-label {
            color: #666;
            font-weight: 500;
        }
        
        .agent-value {
            color: #1a1a1a;
            font-family: monospace;
        }
        
        .agent-summary {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.6;
            color: #333;
            margin-top: 12px;
        }
        
        .agent-summary strong {
            color: #4A90E2;
            font-weight: 600;
        }
        
        .agent-summary em {
            color: #666;
            font-style: italic;
        }
        
        /* Street View Section */
        .streetview-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e5e5e5;
        }
        
        .streetview-header {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .streetview-attribution {
            font-size: 10px;
            color: #999;
            font-weight: 400;
        }
        
        .streetview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
        }
        
        .streetview-item {
            position: relative;
            aspect-ratio: 4 / 3;
            border-radius: 4px;
            overflow: hidden;
            background: #f0f0f0;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }
        
        .streetview-item:hover {
            transform: scale(1.05);
            border-color: #4A90E2;
        }
        
        .streetview-item:focus-visible {
            outline: 2px solid #4A90E2;
            outline-offset: 2px;
        }
        
        .streetview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .streetview-empty {
            grid-column: 1 / -1;
            padding: 16px;
            text-align: center;
            color: #999;
            font-size: 11px;
        }
        
        .streetview-loading {
            grid-column: 1 / -1;
            padding: 16px;
            text-align: center;
            color: #666;
            font-size: 11px;
        }
        
        .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
            padding: 4px 8px;
        }
        
        .close-btn:hover {
            color: #333;
        }
        
        .close-btn:focus-visible {
            outline: 2px solid #4A90E2;
            outline-offset: 2px;
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading-content {
            text-align: center;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4A90E2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #666;
            font-size: 14px;
        }
        
        /* Mapbox popup customization */
        .mapboxgl-popup-content {
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">Loading Urban ABM…</div>
        </div>
    </div>
    
    <!-- Map Container -->
    <div id="map"></div>
    
    <!-- Control Panel (Right) -->
    <div class="panel control-panel">
        <div class="panel-header">Urban ABM</div>
        
        <!-- API Configuration -->
        <div class="section">
            <label for="api-url" style="font-size: 11px; color: #666; display: block; margin-bottom: 4px;">Backend API</label>
            <input type="text" id="api-url" class="api-input" value="http://127.0.0.1:8000" placeholder="http://127.0.0.1:8000" autocomplete="off">
        </div>
        
        <!-- Layer Controls -->
        <div class="section">
            <div class="layer-toggle">
                <input type="checkbox" id="layer-buildings" checked>
                <label for="layer-buildings">Buildings</label>
                <div class="layer-color" style="background: #999;"></div>
            </div>
            <div class="layer-toggle">
                <input type="checkbox" id="layer-network" checked>
                <label for="layer-network">Walk Network</label>
                <div class="layer-color" style="background: #4A90E2;"></div>
            </div>
            <div class="layer-toggle">
                <input type="checkbox" id="layer-roads" checked>
                <label for="layer-roads">Roads</label>
                <div class="layer-color" style="background: #E74C3C;"></div>
            </div>
            <div class="layer-toggle">
                <input type="checkbox" id="layer-amenities" checked>
                <label for="layer-amenities">Amenities</label>
                <div class="layer-color" style="background: #27AE60;"></div>
            </div>
            <div class="layer-toggle">
                <input type="checkbox" id="layer-agents" checked>
                <label for="layer-agents">Agents</label>
                <div class="layer-color" style="background: #F39C12;"></div>
            </div>
            <div class="layer-toggle">
                <input type="checkbox" id="layer-trail" checked>
                <label for="layer-trail">Agent Trail</label>
                <div class="layer-color" style="background: #9B59B6;"></div>
            </div>
        </div>
        
        <!-- Animation Controls -->
        <div class="section">
            <button id="btn-play" class="btn btn-primary">▶ Play Simulation</button>
            <button id="btn-pause" class="btn btn-danger" style="display:none;">⏸ Pause</button>
            
            <div class="speed-control">
                <div class="speed-label">
                    <span>Speed</span>
                    <span id="speed-value">1.0s</span>
                </div>
                <input type="range" id="speed-slider" class="speed-slider" min="0.1" max="5" step="0.1" value="1" aria-label="Animation speed">
            </div>
        </div>
        
        <!-- Agent Search -->
        <div class="section">
            <div class="search-box">
                <input type="number" id="agent-search" class="search-input" placeholder="Agent ID" min="0" aria-label="Agent ID" inputmode="numeric">
                <button id="agent-search-btn" class="search-btn">Find</button>
            </div>
        </div>
        
        <!-- Simulation Stats -->
        <div class="section">
            <div class="stat-row">
                <span class="stat-label">Step</span>
                <span class="stat-value" id="sim-step">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Queries</span>
                <span class="stat-value" id="query-count">0</span>
            </div>
        </div>
    </div>
    
    <!-- Info Panel (Bottom Left) -->
    <div class="panel info-panel">
        <div class="stat-row">
            <span class="stat-label">Buildings</span>
            <span class="stat-value" id="count-buildings">—</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Network Edges</span>
            <span class="stat-value" id="count-network">—</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Amenities</span>
            <span class="stat-value" id="count-amenities">—</span>
        </div>
    </div>
    
    <!-- Agent Detail Panel (Left, Hidden by Default) -->
    <div class="panel agent-panel" id="agent-panel">
        <button class="close-btn" id="close-agent-btn" aria-label="Close agent panel">×</button>
        <div class="panel-header">Agent <span id="agent-id-display"></span></div>
        
        <div class="agent-info-grid">
            <span class="agent-label">Location:</span>
            <span class="agent-value" id="agent-location">—</span>
            
            <span class="agent-label">Nearby:</span>
            <span class="agent-value" id="agent-nearby">—</span>
        </div>
        
        <div class="agent-summary" id="agent-summary" aria-live="polite">
            <em style="color: #999;">Loading perspective…</em>
        </div>
        
        <!-- Street View Section -->
        <div class="streetview-section">
            <div class="streetview-header">
                <span>Street View</span>
                <span class="streetview-attribution">Mapillary</span>
            </div>
            <div class="streetview-grid" id="streetview-grid" role="list">
                <div class="streetview-loading">Loading street views…</div>
            </div>
        </div>
    </div>
    
    <script>
        // IMPORTANT: Replace with your Mapbox access token
        // Get one free at: https://account.mapbox.com/access-tokens/
        mapboxgl.accessToken = 'YOUR_MAPBOX_TOKEN_HERE';
        
        // Map Setup
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/light-v11', // Minimal light style
            center: [2.17, 41.39], // Barcelona default
            zoom: 14,
            pitch: 0,
            bearing: 0
        });
        
        // Add navigation control
        map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');
        
        // State
        let animationInterval = null;
        let animationSpeed = 1000;
        let selectedAgentId = null;
        let agentMarkers = {};
        let summaryUpdateInterval = null;
        let agentTrails = {}; // Track agent movement history { agentId: [[lon, lat], ...] }
        let maxTrailLength = 50; // Keep last 50 positions
        
        // Get API URL
        function getApiUrl() {
            return document.getElementById('api-url').value;
        }
        
        // Load all data
        async function loadAll() {
            try {
                const apiUrl = getApiUrl();
                
                // Load stats
                const statsRes = await fetch(`${apiUrl}/api/stats`);
                const stats = await statsRes.json();
                
                // Update info panel
                document.getElementById('count-buildings').textContent = (stats.buildings || 0).toLocaleString();
                document.getElementById('count-network').textContent = (stats.walk_edges || 0).toLocaleString();
                document.getElementById('count-amenities').textContent = (stats.amenities || 0).toLocaleString();
                
                // Fit map to bounds
                if (stats.bbox) {
                    map.fitBounds([
                        [stats.bbox.minLon, stats.bbox.minLat],
                        [stats.bbox.maxLon, stats.bbox.maxLat]
                    ], { padding: 50 });
                }
                
                // Wait for map to load
                map.on('load', async () => {
                    await loadBuildings();
                    await loadNetwork();
                    await loadRoads();
                    await loadAmenities();
                    await loadAgents();
                    await initializeTrailLayer();
                    
                    document.getElementById('loading').style.display = 'none';
                });
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.querySelector('.loading-text').innerHTML = 
                    'Error: ' + error.message + '<br><small>Ensure backend is running</small>';
            }
        }
        
        // Load Buildings
        async function loadBuildings() {
            const apiUrl = getApiUrl();
            const response = await fetch(`${apiUrl}/api/buildings`);
            const data = await response.json();
            
            map.addSource('buildings', {
                type: 'geojson',
                data: data
            });
            
            map.addLayer({
                id: 'buildings-fill',
                type: 'fill',
                source: 'buildings',
                paint: {
                    'fill-color': '#d4d4d4',
                    'fill-opacity': 0.5
                }
            });
            
            map.addLayer({
                id: 'buildings-outline',
                type: 'line',
                source: 'buildings',
                paint: {
                    'line-color': '#999',
                    'line-width': 0.5
                }
            });
        }
        
        // Load Walk Network
        async function loadNetwork() {
            const apiUrl = getApiUrl();
            const response = await fetch(`${apiUrl}/api/walk_network`);
            const data = await response.json();
            
            map.addSource('network', {
                type: 'geojson',
                data: data
            });
            
            map.addLayer({
                id: 'network-lines',
                type: 'line',
                source: 'network',
                paint: {
                    'line-color': '#4A90E2',
                    'line-width': 3,
                    'line-opacity': 0.8
                }
            });
        }
        
        // Load Roads
        async function loadRoads() {
            const apiUrl = getApiUrl();
            try {
                const response = await fetch(`${apiUrl}/api/roads`);
                const data = await response.json();
                
                if (data.features && data.features.length > 0) {
                    map.addSource('roads', {
                        type: 'geojson',
                        data: data
                    });
                    
                    map.addLayer({
                        id: 'roads-lines',
                        type: 'line',
                        source: 'roads',
                        paint: {
                            'line-color': '#E74C3C',
                            'line-width': 2.5,
                            'line-opacity': 0.7
                        }
                    });
                }
            } catch (error) {
                console.log('No roads available');
            }
        }
        
        // Load Amenities
        async function loadAmenities() {
            const apiUrl = getApiUrl();
            const response = await fetch(`${apiUrl}/api/amenities`);
            const data = await response.json();
            
            map.addSource('amenities', {
                type: 'geojson',
                data: data
            });
            
            map.addLayer({
                id: 'amenities-circles',
                type: 'circle',
                source: 'amenities',
                paint: {
                    'circle-radius': 5,
                    'circle-color': '#27AE60',
                    'circle-stroke-color': '#1E8449',
                    'circle-stroke-width': 1,
                    'circle-opacity': 0.8
                }
            });
            
            // Add click handler for popups
            map.on('click', 'amenities-circles', (e) => {
                const feature = e.features[0];
                const props = feature.properties;
                
                let popupContent = '<div style="font-family: Arial, sans-serif; max-width: 250px;">';
                popupContent += '<strong style="font-size: 14px; color: #1E8449;">' + (props.name || 'Amenity') + '</strong><br>';
                popupContent += '<span style="display: inline-block; background: #27AE60; color: white; padding: 2px 6px; border-radius: 3px; font-size: 11px; margin: 5px 0;">' + (props.amenity || '') + '</span><br>';
                
                if (props.address) {
                    popupContent += '<div style="margin-top: 8px;"><strong style="font-size: 11px;">📍 Address:</strong><br><span style="font-size: 11px;">' + props.address + '</span></div>';
                }
                
                if (props.phone) {
                    popupContent += '<div style="margin-top: 5px;"><strong style="font-size: 11px;">📞 Phone:</strong> <a href="tel:' + props.phone + '" style="font-size: 11px;">' + props.phone + '</a></div>';
                }
                
                if (props.website) {
                    popupContent += '<div style="margin-top: 5px;"><strong style="font-size: 11px;">🌐 Website:</strong> <a href="' + props.website + '" target="_blank" style="font-size: 11px;">Visit site</a></div>';
                }
                
                if (props.amenity_tags) {
                    popupContent += '<div style="margin-top: 8px; padding-top: 5px; border-top: 1px solid #ddd;"><strong style="font-size: 10px; color: #666;">Additional info:</strong><br><span style="font-size: 10px; color: #888;">' + props.amenity_tags + '</span></div>';
                }
                
                popupContent += '</div>';
                
                new mapboxgl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(popupContent)
                    .addTo(map);
            });
            
            map.on('mouseenter', 'amenities-circles', () => {
                map.getCanvas().style.cursor = 'pointer';
            });
            
            map.on('mouseleave', 'amenities-circles', () => {
                map.getCanvas().style.cursor = '';
            });
        }
        
        // Load Agents
        async function loadAgents() {
            const apiUrl = getApiUrl();
            const response = await fetch(`${apiUrl}/api/agents`);
            const data = await response.json();
            
            // Add source for regular agents
            if (!map.getSource('agents')) {
                map.addSource('agents', {
                    type: 'geojson',
                    data: data
                });
                
                // Regular agents layer
                map.addLayer({
                    id: 'agents-circles',
                    type: 'circle',
                    source: 'agents',
                    paint: {
                        'circle-radius': 7,
                        'circle-color': '#F39C12',
                        'circle-stroke-color': '#E67E22',
                        'circle-stroke-width': 2,
                        'circle-opacity': 1
                    }
                });
                
                // Add source and layer for selected agent highlight
                map.addSource('selected-agent', {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: []
                    }
                });
                
                // Pulsing outer ring for selected agent
                map.addLayer({
                    id: 'selected-agent-ring',
                    type: 'circle',
                    source: 'selected-agent',
                    paint: {
                        'circle-radius': 15,
                        'circle-color': '#FFD700',
                        'circle-opacity': 0.3,
                        'circle-stroke-color': '#FFD700',
                        'circle-stroke-width': 2,
                        'circle-stroke-opacity': 0.8
                    }
                });
                
                // Main selected agent marker
                map.addLayer({
                    id: 'selected-agent-marker',
                    type: 'circle',
                    source: 'selected-agent',
                    paint: {
                        'circle-radius': 10,
                        'circle-color': '#FFD700',
                        'circle-stroke-color': '#FFA500',
                        'circle-stroke-width': 3,
                        'circle-opacity': 1
                    }
                });
                
                // Add click handler
                map.on('click', 'agents-circles', (e) => {
                    const feature = e.features[0];
                    const agentId = feature.properties.id;
                    selectAgent(agentId);
                });
                
                map.on('mouseenter', 'agents-circles', () => {
                    map.getCanvas().style.cursor = 'pointer';
                });
                
                map.on('mouseleave', 'agents-circles', () => {
                    map.getCanvas().style.cursor = '';
                });
            } else {
                map.getSource('agents').setData(data);
            }
        }
        
        // Update agents during simulation
        async function updateAgents(agentsData) {
            const features = agentsData.map(agent => ({
                type: 'Feature',
                geometry: {
                    type: 'Point',
                    coordinates: [agent.lon, agent.lat]
                },
                properties: {
                    id: agent.id
                }
            }));
            
            const geojson = {
                type: 'FeatureCollection',
                features: features
            };
            
            map.getSource('agents').setData(geojson);
            
            // Update trails for all agents (but only store for selected agent)
            agentsData.forEach(agent => {
                if (agent.id === selectedAgentId) {
                    // Initialize trail array if needed
                    if (!agentTrails[agent.id]) {
                        agentTrails[agent.id] = [];
                    }
                    
                    // Add current position to trail
                    agentTrails[agent.id].push([agent.lon, agent.lat]);
                    
                    // Keep only last N positions
                    if (agentTrails[agent.id].length > maxTrailLength) {
                        agentTrails[agent.id].shift();
                    }
                    
                    // Update trail on map
                    updateTrailLayer();
                    
                    // Update selected agent highlight position
                    updateSelectedAgentHighlight(agent.lon, agent.lat);
                }
            });
            
            // Update query count
            const queryCount = agentsData.reduce((sum, agent) => sum + (agent.nearby_count || 0), 0);
            document.getElementById('query-count').textContent = queryCount;
        }
        
        // Step simulation
        async function stepSimulation() {
            try {
                const apiUrl = getApiUrl();
                const response = await fetch(`${apiUrl}/api/step_continuous`, { method: 'POST' });
                const data = await response.json();
                
                document.getElementById('sim-step').textContent = data.step;
                
                if (data.agents) {
                    await updateAgents(data.agents);
                }
            } catch (error) {
                console.error('Error stepping simulation:', error);
            }
        }
        
        // Animation controls
        function startAnimation() {
            if (animationInterval) return;
            
            document.getElementById('btn-play').style.display = 'none';
            document.getElementById('btn-pause').style.display = 'block';
            
            animationInterval = setInterval(stepSimulation, animationSpeed);
        }
        
        function pauseAnimation() {
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
            
            document.getElementById('btn-play').style.display = 'block';
            document.getElementById('btn-pause').style.display = 'none';
        }
        
        // Initialize trail layer
        async function initializeTrailLayer() {
            map.addSource('agent-trail', {
                type: 'geojson',
                data: {
                    type: 'FeatureCollection',
                    features: []
                }
            });
            
            map.addLayer({
                id: 'trail-line',
                type: 'line',
                source: 'agent-trail',
                paint: {
                    'line-color': '#9B59B6',
                    'line-width': 4,
                    'line-opacity': 0.8
                }
            });
            
            // Add gradient effect with a second layer
            map.addLayer({
                id: 'trail-dots',
                type: 'circle',
                source: 'agent-trail',
                paint: {
                    'circle-radius': 3,
                    'circle-color': '#9B59B6',
                    'circle-opacity': 0.6
                }
            });
        }
        
        // Update trail layer with current selected agent's path
        function updateTrailLayer() {
            if (!selectedAgentId || !agentTrails[selectedAgentId]) {
                map.getSource('agent-trail').setData({
                    type: 'FeatureCollection',
                    features: []
                });
                return;
            }
            
            const trail = agentTrails[selectedAgentId];
            
            if (trail.length < 2) {
                return; // Need at least 2 points for a line
            }
            
            // Create LineString feature
            const lineFeature = {
                type: 'Feature',
                geometry: {
                    type: 'LineString',
                    coordinates: trail
                },
                properties: {}
            };
            
            // Create point features for each position
            const pointFeatures = trail.map((coord, index) => ({
                type: 'Feature',
                geometry: {
                    type: 'Point',
                    coordinates: coord
                },
                properties: {
                    order: index
                }
            }));
            
            map.getSource('agent-trail').setData({
                type: 'FeatureCollection',
                features: [lineFeature, ...pointFeatures]
            });
        }
        
        // Update selected agent highlight position
        function updateSelectedAgentHighlight(lon, lat) {
            if (!map.getSource('selected-agent')) {
                return;
            }
            
            map.getSource('selected-agent').setData({
                type: 'FeatureCollection',
                features: [{
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [lon, lat]
                    },
                    properties: {
                        id: selectedAgentId
                    }
                }]
            });
        }
        
        // Select agent
        async function selectAgent(agentId) {
            selectedAgentId = agentId;
            
            // Clear previous trail when selecting new agent
            agentTrails = {};
            agentTrails[agentId] = [];
            
            // Show agent panel
            document.getElementById('agent-panel').style.display = 'block';
            document.getElementById('agent-id-display').textContent = agentId;
            
            // Fetch agent summary
            await showAgentSummary(agentId);
            
            // Fetch street view images (initial)
            await showStreetView(agentId);
            
            // Start periodic updates
            if (summaryUpdateInterval) {
                clearInterval(summaryUpdateInterval);
            }
            summaryUpdateInterval = setInterval(() => {
                if (selectedAgentId === agentId) {
                    showAgentSummary(agentId);
                    showStreetView(agentId);
                }
            }, 5000); // Update every 5 seconds
        }
        
        // Parse simple markdown to HTML (for LLM outputs)
        function parseMarkdown(text) {
            if (!text) return text;
            
            // Convert **bold** to <strong>bold</strong>
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            
            // Convert *italic* to <em>italic</em>
            text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
            
            // Convert line breaks to <br>
            text = text.replace(/\n/g, '<br>');
            
            return text;
        }
        
        // Show agent summary
        async function showAgentSummary(agentId) {
            const apiUrl = getApiUrl();
            try {
                const response = await fetch(`${apiUrl}/api/agent/${agentId}/summary`);
                const data = await response.json();
                
                if (data.error) {
                    console.error('Agent not found:', agentId);
                    return;
                }
                
                document.getElementById('agent-location').textContent = 
                    `${data.location.lon.toFixed(5)}, ${data.location.lat.toFixed(5)}`;
                document.getElementById('agent-nearby').textContent = 
                    `${data.amenity_count} amenities`;
                
                // Parse markdown formatting in summary
                const formattedSummary = parseMarkdown(data.summary);
                document.getElementById('agent-summary').innerHTML = formattedSummary;
                
                // Pan to agent
                map.flyTo({
                    center: [data.location.lon, data.location.lat],
                    zoom: 17,
                    duration: 1000
                });
                
            } catch (error) {
                console.error('Error fetching agent summary:', error);
                document.getElementById('agent-summary').innerHTML = 
                    '<em style="color: #E74C3C;">Error loading perspective</em>';
            }
        }
        
        // Show street view images from Mapillary
        async function showStreetView(agentId) {
            const apiUrl = getApiUrl();
            const gridContainer = document.getElementById('streetview-grid');
            
            try {
                const response = await fetch(`${apiUrl}/api/agent/${agentId}/streetview`);
                const data = await response.json();
                
                if (data.error) {
                    console.error('Agent not found:', agentId);
                    return;
                }
                
                // Clear existing content
                gridContainer.innerHTML = '';
                
                if (data.images && data.images.length > 0) {
                    // Create image elements - thumb_url contains 1024px resolution
                    data.images.forEach((img, index) => {
                        const button = document.createElement('button');
                        button.className = 'streetview-item';
                        button.type = 'button';
                        button.setAttribute('role', 'listitem');
                        button.setAttribute('aria-label', `Street view image ${index + 1} from ${new Date(img.captured_at).toLocaleDateString()}`);
                        
                        const imgElement = document.createElement('img');
                        imgElement.src = img.thumb_url;  // 1024px resolution (thumb_1024_url)
                        imgElement.alt = `Street view captured on ${new Date(img.captured_at).toLocaleDateString()}`;
                        imgElement.loading = 'lazy';
                        
                        button.appendChild(imgElement);
                        
                        // Click handler
                        button.addEventListener('click', () => {
                            window.open(`https://www.mapillary.com/app/?pKey=${img.id}`, '_blank', 'noopener,noreferrer');
                        });
                        
                        // Keyboard handler
                        button.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                button.click();
                            }
                        });
                        
                        gridContainer.appendChild(button);
                    });
                } else {
                    // No images available
                    const emptyState = document.createElement('div');
                    emptyState.className = 'streetview-empty';
                    emptyState.textContent = 'No street views available in this area';
                    gridContainer.appendChild(emptyState);
                }
                
            } catch (error) {
                console.error('Error fetching street view:', error);
                gridContainer.innerHTML = '<div class="streetview-empty">Error loading street views</div>';
            }
        }
        
        // Event listeners
        document.getElementById('btn-play').addEventListener('click', startAnimation);
        document.getElementById('btn-pause').addEventListener('click', pauseAnimation);
        
        document.getElementById('speed-slider').addEventListener('input', (e) => {
            animationSpeed = parseFloat(e.target.value) * 1000;
            document.getElementById('speed-value').textContent = e.target.value + 's';
            
            if (animationInterval) {
                pauseAnimation();
                startAnimation();
            }
        });
        
        document.getElementById('agent-search-btn').addEventListener('click', () => {
            const agentId = parseInt(document.getElementById('agent-search').value);
            if (!isNaN(agentId)) {
                selectAgent(agentId);
            }
        });
        
        document.getElementById('agent-search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('agent-search-btn').click();
            }
        });
        
        document.getElementById('close-agent-btn').addEventListener('click', () => {
            document.getElementById('agent-panel').style.display = 'none';
            selectedAgentId = null;
            
            // Clear trail
            agentTrails = {};
            updateTrailLayer();
            
            // Clear highlight
            if (map.getSource('selected-agent')) {
                map.getSource('selected-agent').setData({
                    type: 'FeatureCollection',
                    features: []
                });
            }
            
            if (summaryUpdateInterval) {
                clearInterval(summaryUpdateInterval);
                summaryUpdateInterval = null;
            }
        });
        
        // Layer toggles
        document.getElementById('layer-buildings').addEventListener('change', (e) => {
            map.setLayoutProperty('buildings-fill', 'visibility', e.target.checked ? 'visible' : 'none');
            map.setLayoutProperty('buildings-outline', 'visibility', e.target.checked ? 'visible' : 'none');
        });
        
        document.getElementById('layer-network').addEventListener('change', (e) => {
            map.setLayoutProperty('network-lines', 'visibility', e.target.checked ? 'visible' : 'none');
        });
        
        document.getElementById('layer-roads').addEventListener('change', (e) => {
            if (map.getLayer('roads-lines')) {
                map.setLayoutProperty('roads-lines', 'visibility', e.target.checked ? 'visible' : 'none');
            }
        });
        
        document.getElementById('layer-amenities').addEventListener('change', (e) => {
            map.setLayoutProperty('amenities-circles', 'visibility', e.target.checked ? 'visible' : 'none');
        });
        
        document.getElementById('layer-agents').addEventListener('change', (e) => {
            map.setLayoutProperty('agents-circles', 'visibility', e.target.checked ? 'visible' : 'none');
        });
        
        document.getElementById('layer-trail').addEventListener('change', (e) => {
            map.setLayoutProperty('trail-line', 'visibility', e.target.checked ? 'visible' : 'none');
            map.setLayoutProperty('trail-dots', 'visibility', e.target.checked ? 'visible' : 'none');
        });
        
        // Initialize
        loadAll();
    </script>
</body>
</html>
